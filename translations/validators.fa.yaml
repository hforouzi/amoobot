# متن پیام همگانی در برابر قواعد قالب‌بندی تلگرام (BroadcastMessage، BroadcastFormat).
broadcast.format.markdown.reserved: "خط {{ line }}: «{{ char }}» در MarkdownV2 کاراکتر رزرو شده است و باید به صورت \\{{ char }} نوشته شود. آن را با \\ بنویسید، «افزودن خودکار \\» را بزنید یا قالب «متن ساده» را انتخاب کنید."
broadcast.format.markdown.unclosed: "خط {{ line }}: «{{ char }}» قالب‌بندی‌ای را شروع می‌کند که بسته نشده است. آن را با همان علامت ببندید، اگر خود کاراکتر منظور است پیش از آن \\ بگذارید یا «افزودن خودکار \\» را بزنید."
broadcast.format.markdown.link: "خط {{ line }}: لینک به شکل [متن](آدرس) با «)» پایانی نوشته نشده است. لینک را اصلاح کنید یا اگر خود کاراکترها منظور است پیش از [ ] ( ) علامت \\ بگذارید."
broadcast.format.html.bare_lt: "خط {{ line }}: «<» شروع یک تگ نیست. آن را &lt; بنویسید (و & را &amp;) یا قالب «متن ساده» را انتخاب کنید."
broadcast.format.html.unsupported: "خط {{ line }}: تلگرام تگ <{{ tag }}> را پشتیبانی نمی‌کند. فقط از b، i، u، s، a، code، pre، blockquote و tg-spoiler استفاده کنید؛ برای خط جدید فقط Enter بزنید."
broadcast.format.html.unclosed_start: "خط {{ line }}: یک تگ با «>» بسته نشده است."
broadcast.format.html.unexpected_end: "خط {{ line }}: </{{ tag }}> تگی را می‌بندد که باز نشده است. آن را حذف کنید یا <{{ tag }}> را جایی که قالب‌بندی شروع می‌شود اضافه کنید."
broadcast.format.html.mismatched: "خط {{ line }}: به جای </{{ expected }}>، </{{ tag }}> آمده است. تگ‌ها را به ترتیب عکس باز شدن ببندید، مثلاً <b><i>…</i></b>."
broadcast.format.html.unclosed: "تگ <{{ tag }}> بسته نشده است. جایی که قالب‌بندی تمام می‌شود </{{ tag }}> را اضافه کنید."
broadcast.format.html.span: "خط {{ line }}: تلگرام <span> را فقط به صورت <span class=\"tg-spoiler\"> می‌پذیرد."
