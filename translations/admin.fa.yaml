    url_invalid: 'آدرس پنل معتبر نیست؛ باید با https:// شروع شود و رمز، ? یا # نداشته باشد.'
    url_plain_http: 'http:// فقط برای پنلی روی همین سرور یا شبکه خصوصی (127.0.0.1 یا IP خصوصی) مجاز است؛ در غیر این صورت توکن بدون رمزنگاری در اینترنت ارسال می‌شود. از https:// استفاده کنید.'
    token_required: API Token را وارد کنید.
    token_or_login_required: API Token یا نام کاربری و رمز عبور پنل را وارد کنید.
    tls_pin: 'پین باید هش SHA-256 کلید عمومی به‌صورت base64 باشد (۴۴ کاراکتر که با = تمام می‌شود).'
  flash:
    created: پنل ذخیره شد. حالا «تست اتصال» را بزنید.
    saved: تنظیمات اتصال ذخیره شد.
    csrf: نشست فرم منقضی شده است؛ دوباره تلاش کنید.
  report:
    title: نتیجه تست اتصال
    reachable: دسترسی به پنل
    tls: گواهی HTTPS
    auth: احراز هویت
    mode: نوع API
    latency: تأخیر پاسخ
    inbounds: تعداد اینباندها
    fix: راه حل
    ok_modern: اتصال برقرار است و پنل API جدید را پشتیبانی می‌کند. اکنون اینباندهای قابل فروش را انتخاب کنید.
    ok_legacy: اتصال با نام کاربری/رمز برقرار است (پنل قدیمی). برای API جدید، 3x-ui را به‌روز کنید و API Token بسازید.
  tls:
    verified: معتبر (بررسی‌شده)
    pinned: self-signed، مطابق پین ذخیره‌شده
    plain_local: http روی شبکه محلی (بدون TLS)
    failed: نامعتبر
    not_checked: بررسی نشد
  failure:
    network_dns:
      title: نام دامنه پنل پیدا نشد (DNS)
      explain: سرور بات نتوانست آدرس IP دامنه پنل را پیدا کند.
      fix: نام دامنه را در آدرس پنل بررسی کنید و مطمئن شوید رکورد DNS آن به IP سرور پنل اشاره می‌کند.
    network_refused:
      title: اتصال رد شد
      explain: سرور پنل در دسترس است ولی روی این پورت به اتصال پاسخ نمی‌دهد.
      fix: پورت پنل را در آدرس بررسی کنید، مطمئن شوید پنل روشن است و فایروال پنل اجازه اتصال از IP سرور بات را می‌دهد.
    network_timeout:
      title: پنل پاسخ نداد (timeout)
      explain: در زمان مجاز (۳ ثانیه برای اتصال، ۱۰ ثانیه برای کل درخواست) پاسخی نیامد.
      fix: فایروال سرور پنل را برای IP سرور بات باز کنید، پورت را بررسی کنید یا در صورت فیلتر بودن، پروکسی را در تنظیمات پیشرفته فعال کنید.
    network_other:
      title: خطای شبکه
      explain: اتصال به پنل به دلیل یک خطای شبکه برقرار نشد.
      fix: آدرس، پورت، فایروال و تنظیمات پروکسی را بررسی کنید و جزئیات فنی زیر را ببینید.
    tls_certificate:
      title: گواهی HTTPS پنل معتبر نیست
      explain: گواهی پنل منقضی شده، برای این دامنه صادر نشده، self-signed است یا با پین ذخیره‌شده مطابقت ندارد.
      fix: 'برای پنل یک گواهی معتبر (مثلاً Let''s Encrypt) روی همان دامنه تنظیم کنید؛ یا اگر عمداً self-signed است، پین کلید عمومی آن را در تنظیمات پیشرفته وارد کنید. بررسی گواهی هرگز خاموش نمی‌شود.'
    auth_rejected:
      title: API Token پذیرفته نشد (401/403)
      explain: پنل توکن را نامعتبر یا باطل‌شده می‌داند.
      fix: 'در پنل 3x-ui به Settings → Security → API Token بروید، توکن جدید بسازید و در «ویرایش تنظیمات» وارد کنید.'
    wrong_url:
      title: آدرس یا مسیر پنل اشتباه است
      explain: در این آدرس API پنل پیدا نشد (خطای 404 یا یک صفحه HTML به‌جای پاسخ JSON).
      fix: 'آدرس را دقیقاً همان‌طور که پنل را در مرورگر باز می‌کنید وارد کنید، همراه با مسیر مخفی (web base path)، مثلاً https://host:2053/secret/ . پنل‌های خیلی قدیمی API جدید ندارند: 3x-ui را به‌روز کنید.'
    panel_rejected:
      title: پنل درخواست را رد کرد
      explain: پنل پاسخ داد ولی با success=false (پیام پنل در جزئیات زیر است).
      fix: پیام پنل را بخوانید؛ معمولاً تنظیمات API پنل یا نسخه آن را باید بررسی کرد.
    unexpected_response:
      title: پاسخ پنل قابل فهم نبود
      explain: پنل JSON برگرداند ولی ساختار آن با API مستند 3x-ui ({success, msg, obj}) یکی نیست.
      fix: 3x-ui را به آخرین نسخه به‌روز کنید و مطمئن شوید آدرس به خود پنل اشاره می‌کند، نه به سرویس دیگری.
    http_error:
      title: خطای HTTP از پنل
      explain: پنل با یک کد خطای HTTP (مثل 500 یا 502) یا یک ریدایرکت پاسخ داد.
      fix: لاگ پنل را بررسی کنید. اگر ریدایرکت است، آدرس نهایی (مثلاً https به‌جای http) را وارد کنید.
    not_configured:
      title: تنظیمات اتصال ناقص است
      explain: آدرس پنل، API Token یا پروکسی کامل یا مجاز نیست.
      fix: در «ویرایش تنظیمات» آدرس (https://) و API Token را وارد کنید؛ اگر پروکسی فعال است، متغیرهای PANEL_PROXY_* سرور را تنظیم کنید.
