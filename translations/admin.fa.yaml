    type: برای تست محلی dummy و برای پنل واقعی Sanaei/3x-ui مقدار sanaei_3xui را انتخاب کنید.
    sanaei_integration: Legacy از نام کاربری و رمز عبور یا bearer اختیاری استفاده می‌کند. Modern از API Token رسمی استفاده می‌کند.
    title: یک نام قابل تشخیص برای این پنل، مانند «پنل آلمان ۱»
    base_url: "فقط آدرس پایه پنل را وارد کنید؛ مسیر API به‌صورت خودکار اضافه می‌شود. مثال: https://panel.example.com:2053"
    use_proxy: در صورت فعال بودن، درخواست‌های پنل از تنظیمات محیطی PANEL_PROXY_* استفاده می‌کنند.
    modern_callout: در حالت Modern به نام کاربری و رمز عبور نیازی نیست.
    modern_api_token: توکن API را از پنل 3x-ui در مسیر Settings → Security → API Token دریافت کنید. هنگام ویرایش، خالی گذاشتن این فیلد توکن فعلی را حفظ می‌کند.
    legacy_callout: برای پنل‌های قدیمی Sanaei که از ورود با نام کاربری و رمز عبور استفاده می‌کنند.
    auth_mode: برای پنل‌های نام کاربری و رمز عبور، Cookie login را انتخاب کنید. Bearer token فقط برای تنظیمات Legacy v3 استفاده می‌شود.
    legacy_username: برای ورود Cookie الزامی است.
    legacy_password: برای ورود Cookie الزامی است. هنگام ویرایش، خالی گذاشتن این فیلد رمز عبور فعلی را حفظ می‌کند.
    legacy_api_token: فقط وقتی روش احراز هویت Legacy روی Bearer token است الزامی است. هنگام ویرایش، خالی گذاشتن این فیلد توکن فعلی را حفظ می‌کند.
    api_version: پنل‌های Legacy معمولا مقدار legacy را استفاده می‌کنند. فقط وقتی تنظیمات bearer یا client API در Sanaei v3 لازم است v3 را انتخاب کنید.
    client_api_mode: انتخاب پیشرفته endpoint کلاینت در Legacy. مگر اینکه پنل Sanaei v3 به endpoint clients نیاز داشته باشد، مقدار پیش‌فرض را تغییر ندهید.
    base_path: پیشوند مسیر reverse proxy مانند /xui. برای URL معمولی پنل خالی بگذارید.
    subscription_path_prefix: پیشوند مسیر اشتراک Legacy. فقط برای مسیر سفارشی اشتراک پر شود.
    subscription_base_url: آدرس پایه عمومی اشتراک برای لینک‌های Legacy. برای استفاده از URL پنل خالی بگذارید.
    public_host: میزبان جایگزین برای لینک‌های تکی Legacy. برای حالت معمولی خالی بگذارید.
    config: تنظیمات JSON فنی فقط برای نمایش است؛ مقدارهای حساس پنهان می‌شوند.
    is_active: برای نگه داشتن تنظیمات بدون استفاده در provisioning این گزینه را غیرفعال کنید.
