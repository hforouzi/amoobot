plan.additional_inbounds.other_panel: "%inbound% is on another panel: every inbound of a plan must be on the panel of the plan's inbound."
plan.additional_inbounds.inactive: "%inbound% is not active: only active inbounds can be added."
plan.additional_inbounds.not_modern: "Several inbounds need the panel in modern mode (Panels → test connection)."
plan.additional_inbounds.protocol: "%inbound% uses %protocol%: a plan with several inbounds supports VLESS, VMess, Trojan and Shadowsocks only."
