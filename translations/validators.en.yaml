# Broadcast text against Telegram's formatting rules (BroadcastMessage, BroadcastFormat).
broadcast.format.markdown.reserved: "Line {{ line }}: “{{ char }}” is a reserved character in MarkdownV2 and must be written as \\{{ char }}. Escape it, use “Escape automatically”, or choose the plain text format."
broadcast.format.markdown.unclosed: "Line {{ line }}: “{{ char }}” starts formatting that is never closed. Close it with the same mark, put \\ before it if you meant the character itself, or use “Escape automatically”."
broadcast.format.markdown.link: "Line {{ line }}: a link is not written as [text](address) with a closing “)”. Fix the link, or put \\ before [ ] ( ) if you meant the characters."
broadcast.format.html.bare_lt: "Line {{ line }}: “<” does not start a tag. Write it as &lt; (and & as &amp;), or choose the plain text format."
broadcast.format.html.unsupported: "Line {{ line }}: Telegram does not support the <{{ tag }}> tag. Use only b, i, u, s, a, code, pre, blockquote and tg-spoiler; for a new line just press Enter."
broadcast.format.html.unclosed_start: "Line {{ line }}: a tag is not closed with “>”."
broadcast.format.html.unexpected_end: "Line {{ line }}: </{{ tag }}> closes a tag that was never opened. Remove it, or add <{{ tag }}> where the formatting starts."
broadcast.format.html.mismatched: "Line {{ line }}: </{{ tag }}> was found where </{{ expected }}> was expected. Close tags in the reverse order of opening, such as <b><i>…</i></b>."
broadcast.format.html.unclosed: "<{{ tag }}> is never closed. Add </{{ tag }}> where the formatting ends."
broadcast.format.html.span: "Line {{ line }}: Telegram accepts <span> only as <span class=\"tg-spoiler\">."
