# راهنمای مشتری در بخش «راهنما»ی مینی‌اپ (App\MiniApp\Guide، docs/fa/miniapp-guide.md): guide.<topic>.title و
# guide.<topic>.body. قالب: خط خالی = پاراگراف تازه، «## » زیرعنوان، فهرست با «- » یا «1. »، **پررنگ**،
# [متن](#topic) لینک به موضوع دیگر، «{{ payment_methods }}» در یک خط جدا، بلوک‌های «::: if <feature>» … «:::».
# هرگز لینک، توکن، شمارهٔ کارت یا اطلاعات یک مشتری.
guide.start.title: "شروع کار"
guide.start.body: |
  این فروشگاه سرویس VPN می‌فروشد. هر سرویس یک لینک اشتراک شخصی دارد که آن را در یک برنامهٔ VPN روی گوشی یا کامپیوتر اضافه می‌کنید.

  روش کار:
  ::: if new_orders
  1. از بخش **خرید** یک سرویس بخرید.
  :::
  2. یک برنامهٔ VPN روی دستگاهتان نصب کنید.
  3. سرویس را به برنامه اضافه کنید و وصل شوید.

  گام‌به‌گام: [نصب و اتصال](#connect).
guide.buy.title: "خرید سرویس"
guide.buy.body: |
  1. بخش **خرید** را باز کنید و یک پلن انتخاب کنید.
  2. اگر کد تخفیف دارید، پیش از پرداخت واردش کنید.
  3. روش پرداخت را انتخاب کنید و پرداخت را کامل کنید.
  4. کمی بعد از تأیید پرداخت، سرویس تازه در بخش **سرویس‌ها** دیده می‌شود.
  ::: if trial

  می‌خواهید اول امتحان کنید؟ در بخش **خرید** اکانت تست رایگان هم هست.
  :::

  روش‌های پرداخت: [روش‌های پرداخت](#pay).
guide.pay.title: "روش‌های پرداخت"
guide.pay.body: |
  ::: if payment_methods
  می‌توانید با این روش‌ها پرداخت کنید:
  {{ payment_methods }}
  :::
  ::: if wallet_payment
  اگر موجودی **کیف پول** کل مبلغ را پوشش دهد، از کیف پول هم می‌توانید پرداخت کنید.
  :::
  ::: if card_to_card

  ## کارت به کارت
  دقیقاً همان مبلغی را که در صفحهٔ پرداخت نوشته شده واریز کنید و عکس رسید را همان‌جا بفرستید. پشتیبانی آن را بررسی می‌کند و بعد سرویس تحویل داده می‌شود.
  :::
  ::: if online

  ## پرداخت آنلاین
  به صفحهٔ پرداخت بانک یا سرویس پرداخت می‌روید. بعد از پرداخت به برنامه برگردید؛ پرداخت خودکار بررسی می‌شود.
  :::
  ::: if crypto

  ## رمزارز
  دقیقاً همان مبلغ را روی همان شبکه‌ای که نوشته شده بفرستید. تأیید ممکن است چند دقیقه طول بکشد.
  :::
guide.wallet.title: "کیف پول"
guide.wallet.body: |
  کیف پول، پولی است که از قبل شارژ می‌کنید.

  - **کیف پول من** را (در خانه، یا در بخش سرویس‌ها) باز کنید تا موجودی و تاریخچه را ببینید.
  - همان‌جا با هر روش پرداخت می‌توانید کیف پول را شارژ کنید.
  ::: if wallet_payment
  - اگر موجودی کل مبلغ را پوشش دهد، سفارش را با یک لمس از کیف پول پرداخت می‌کنید.
  :::
guide.connect.title: "نصب و اتصال"
guide.connect.body: |
  1. یک برنامهٔ VPN که از لینک اشتراک پشتیبانی می‌کند روی گوشی یا کامپیوترتان نصب کنید. اگر نمی‌دانید کدام برنامه مناسب است، از پشتیبانی بپرسید.
  2. بخش **سرویس‌ها** را باز کنید، سرویستان را انتخاب کنید و صفحهٔ اشتراک آن را باز کنید. لینک اشتراک و کد QR آن آنجاست.
  3. در برنامهٔ VPN یک اشتراک تازه اضافه کنید: لینک را جای‌گذاری کنید یا کد QR را اسکن کنید.
  4. اشتراک را در برنامه به‌روز کنید، یک سرور انتخاب کنید و وصل شوید.

  لینک اشتراکتان را به کسی ندهید: هر کس آن را داشته باشد می‌تواند از سرویس شما استفاده کند.
guide.usage.title: "مصرف و تاریخ پایان"
guide.usage.body: |
  در بخش **سرویس‌ها** می‌بینید هر سرویس چند روز و چقدر حجم باقی دارد.

  - **فعال**: سرویس کار می‌کند.
  - **حجم تمام شده**: حجم سرویس مصرف شده است.
  - **منقضی شده**: زمان سرویس تمام شده است.
  - **غیرفعال**: سرویس خاموش شده است.

  برای دیدن آخرین اعداد، در صفحهٔ سرویس **بروزرسانی مصرف** را بزنید.
guide.renew.title: "تمدید"
guide.renew.body: |
  سرویستان را در بخش **سرویس‌ها** باز کنید، **تمدید و افزایش حجم** و بعد **تمدید سرویس** را بزنید.

  می‌توانید پیش یا بعد از پایان سرویس تمدید کنید. صفحهٔ تمدید، روز و حجم تازه را پیش از پرداخت نشان می‌دهد. اینکه روز و حجم باقی‌مانده منتقل شود یا نه، به قوانین فروشگاه بستگی دارد.
guide.traffic.title: "افزایش حجم"
guide.traffic.body: |
  حجمتان رو به اتمام است؟ سرویس را در بخش **سرویس‌ها** باز کنید، **تمدید و افزایش حجم** و بعد **خرید حجم اضافه** را بزنید. مقدار را انتخاب کنید و پرداخت کنید.

  حجم اضافه به همان سرویس اضافه می‌شود و روزهای سرویس تغییر نمی‌کند.
guide.troubleshoot.title: "وقتی وصل نمی‌شود"
guide.troubleshoot.body: |
  این گام‌ها را به ترتیب امتحان کنید:

  1. در بخش **سرویس‌ها** ببینید سرویس فعال است، منقضی نشده و هنوز حجم دارد.
  2. اشتراک را در برنامهٔ VPN به‌روز (refresh) کنید.
  3. در برنامه کانفیگ یا سرور دیگری انتخاب کنید.
  4. مطمئن شوید تاریخ و ساعت گوشی روی حالت خودکار است.
  5. شبکهٔ دیگری را امتحان کنید: بین Wi-Fi و اینترنت همراه جابه‌جا شوید.
  6. سرویس را از برنامه حذف کنید و دوباره اضافه کنید.
  7. باز هم وصل نشد؟ به پشتیبانی پیام دهید و شمارهٔ سرویس را بگویید (عدد بعد از # روی سرویس، مثلاً سرویس #12).

  **لینک اشتراکتان را برای هیچ‌کس نفرستید، حتی برای پشتیبانی.**
guide.claim.title: "لینک سرویس از کسی گرفته‌اید؟"
guide.claim.body: |
  فروشنده می‌تواند یک سرویس را با یک لینک مخصوص به شما واگذار کند.

  - لینک را در تلگرام باز کنید و تأیید کنید. سرویس به حساب شما اضافه می‌شود.
  - لینک فقط یک بار و فقط تا مدت محدودی کار می‌کند.
  - بعد از پذیرفتن، فروشنده دیگر لینک‌های سرویس را نمی‌بیند.

  اگر لینک کار نکرد، از کسی که آن را فرستاده لینک تازه بخواهید.
guide.faq.title: "پرسش‌های رایج"
guide.faq.body: |
  ## وصل نمی‌شود. چه کار کنم؟
  گام‌های [وقتی وصل نمی‌شود](#troubleshoot) را دنبال کنید.

  ## یک سرویس روی چند دستگاه کار می‌کند؟
  به پلن شما و قوانین فروشگاه بستگی دارد. اگر مطمئن نیستید، از پشتیبانی بپرسید.

  ## چرا حجمم زود تمام شد؟
  هم دانلود و هم آپلود حساب می‌شود. برنامه‌هایی که در پس‌زمینه کار می‌کنند و به‌روزرسانی‌های خودکار هم حجم مصرف می‌کنند.
  ::: if renewals

  ## چطور تمدید کنم؟
  بخش [تمدید](#renew) را ببینید.
  :::

  ## پرداخت کردم ولی سرویس نیامد.
  چند دقیقه صبر کنید و بعد **سفارش‌های من** را در بخش سرویس‌ها ببینید.
  ::: if card_to_card
  پرداخت کارت به کارت بعد از تأیید رسید توسط پشتیبانی تحویل داده می‌شود.
  :::
  ::: if online
  برای پرداخت آنلاین: اگر بعد از چند دقیقه هنوز سرویس نیامده، کد پیگیری سفارش را برای پشتیبانی بفرستید.
  :::
  ::: if crypto
  برای پرداخت رمزارزی: تأیید ممکن است بیشتر طول بکشد. اگر باز هم نیامد، کد پیگیری سفارش را برای پشتیبانی بفرستید.
  :::

  ## می‌توانم پولم را پس بگیرم؟
  لطفاً از پشتیبانی بپرسید.
guide.support.title: "تماس با پشتیبانی"
guide.support.body: |
  اگر چیزی روشن نیست یا کار نمی‌کند، به پشتیبانی پیام دهید. شمارهٔ سرویس را بگویید، هرگز لینک اشتراک را.
