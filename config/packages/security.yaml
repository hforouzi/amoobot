security:
    password_hashers:
        App\Entity\AdminUser: auto

    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: admin_users
            user_checker: App\Security\AdminUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: authenticate
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 1209600
                path: /
            logout:
                path: admin_logout
                target: /admin/login

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/locale/(fa|en)$, roles: PUBLIC_ACCESS }
        - { path: ^/telegram/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/payment/callback, roles: PUBLIC_ACCESS }
        - { path: ^/payment/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/payment/success$, roles: PUBLIC_ACCESS }
        - { path: ^/payment/cancel$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
