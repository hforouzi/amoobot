# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Both hosts while BRAND_PUBLIC_BASE_URL is active; empty (no host check) otherwise.
    trusted_hosts: '%env(brand_trusted_hosts:default::BRAND_PUBLIC_BASE_URL)%'
    default_locale: '%env(APP_DEFAULT_LOCALE)%'
    enabled_locales: ['fa', 'en']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Tests never reach the network: every HttpClient call is answered by MockHttpResponder.
        http_client:
            mock_response_factory: App\Tests\Support\MockHttpResponder
