framework:
    rate_limiter:
        # Public subscription page /s/{token}: per client IP, wrong tokens included (no free guessing).
        subscription_page:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # App downloads /d/{id}: per client IP (large files; Range requests of one download count once each).
        app_download:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # Mini App login /app/auth: every attempt per client IP; valid attempts per Telegram user (MiniAppAuthController).
        miniapp_auth_ip:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        miniapp_auth_user:
            policy: sliding_window
            limit: 10
            interval: '5 minutes'
        # Mini App orders/payments/trials created, per Telegram user (MiniAppCheckoutController).
        miniapp_checkout:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
        # Mini App receipt uploads, per Telegram user.
        miniapp_receipt:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
        # Mini App admin actions (approve, suspend, ...), per admin (AdminActions).
        miniapp_admin_action:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Claim links (docs/design/reseller-and-claim.md, 3.1 / 3.7). Made by one reseller (ClaimLinks).
        claim_create:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Previews and claims of claim links per Telegram user, invalid tokens included (ClaimService).
        claim_attempt_user:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
        # The Mini App claim routes per client IP, every attempt (MiniAppClaimController).
        claim_attempt_ip:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Invalid claim tokens per Telegram user: the 5th in an hour is reported to the admins (no ban).
        claim_invalid_user:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # "Reset my connection links" per service (ServiceOwnership): each one makes every installed app import new links.
        claim_reset_links:
            policy: sliding_window
            limit: 3
            interval: '1 day'
