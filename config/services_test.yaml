services:
    App\Tests\Support\MockHttpResponder:
        public: true

    App\Tests\Support\ProgrammableVpnPanelDriver:
        public: true
        tags: ['app.vpn_driver']

    # Records translation keys a page uses that its locale does not define (TranslationCompletenessTest).
    App\Tests\Support\MissingTranslationRecorder:
        decorates: translator
        arguments: ['@.inner']
        public: true

    # The compiler would inline or remove the module registries and VpnProductModule (in production only
    # ProductModuleResolver uses them). These test-only aliases keep them as services for tests/Module,
    # tests/Provisioning/VpnProductModuleTest, VpnCapabilityHonestyTest and the spies that replace the registry
    # (SettlementViaProductModuleTest, SpyProductModule).
    test.module.product_module_registry:
        alias: App\Module\Application\ProductModuleRegistry
        public: true
    test.module.provider_driver_registry:
        alias: App\Module\Application\ProviderDriverRegistry
        public: true
    test.module.vpn_product_module:
        alias: App\Provisioning\Application\VpnProductModule
        public: true

    # Counts SQL statements for query-budget tests (AdminDashboardTest).
    App\Tests\Support\QueryCounter:
        public: true
        tags: ['doctrine.middleware']

