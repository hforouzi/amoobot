<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <meta name="format-detection" content="telephone=no">
    <title>اشتراک من</title>
    <style>
        :root {
            --bg: #f4f6fb; --card: #ffffff; --fg: #111827; --muted: #6b7280; --border: #e5e7eb;
            --accent: #2563eb; --accent-fg: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
            --track: #e5e7eb; --code: #f3f4f6; --radius: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1020; --card: #151b2e; --fg: #e5e7eb; --muted: #9ca3af; --border: #263049;
                --accent: #3b82f6; --accent-fg: #ffffff; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171;
                --track: #263049; --code: #0f1528;
            }
        }
        /* Vazirmatn, self-hosted with the Mini App (public/miniapp/fonts, OFL); CSP font-src 'self'. */
        @font-face {
            font-family: Vazirmatn; font-style: normal; font-weight: 100 900; font-display: swap;
            src: url("/miniapp/fonts/Vazirmatn-wght.woff2?v=33.003") format("woff2-variations"), url("/miniapp/fonts/Vazirmatn-wght.woff2?v=33.003") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0600-06FF, U+0750-077F,
                           U+08A0-08FF, U+200C-200F, U+2010-2027, U+2030-205E, U+20AC, U+2122, U+2212, U+FB50-FDFF, U+FE70-FEFF, U+FEFF, U+FFFD;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--fg); line-height: 1.7;
            font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
            padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        }
        main { width: 100%; max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
        h1 { font-size: 1.25rem; margin: 0; }
        h2 { font-size: 1.05rem; margin: 0 0 10px; }
        p { margin: 0 0 8px; }
        .muted { color: var(--muted); font-size: .9rem; }
        .ltr { direction: ltr; unicode-bidi: isolate; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; color: #fff; }
        .badge.active { background: var(--ok); } .badge.expired, .badge.limited { background: var(--bad); } .badge.suspended { background: var(--warn); }
        .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
        .stat { background: var(--code); border-radius: 10px; padding: 10px; min-width: 0; }
        .stat b { display: block; font-size: 1.05rem; overflow-wrap: anywhere; }
        .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 12px; }
        .bar span { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
        .bar.high span { background: var(--warn); } .bar.full span { background: var(--bad); }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 46px;
            padding: 10px 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg);
            font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; text-align: center;
        }
        .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .btn.small { min-height: 40px; font-size: .92rem; }
        .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        .qr { display: block; width: min(280px, 100%); height: auto; margin: 14px auto 4px; background: #fff; border-radius: 10px; }
        .url { margin-top: 10px; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--code); color: var(--fg); font: .85rem ui-monospace, Menlo, Consolas, monospace; direction: ltr; text-align: left; }
        details { margin-top: 12px; } summary { cursor: pointer; color: var(--accent); font-weight: 600; }
        ol.configs { padding-inline-start: 18px; margin: 10px 0 0; }
        ol.configs li { margin-bottom: 10px; }
        code { display: block; background: var(--code); border-radius: 8px; padding: 8px; font: .8rem/1.6 ui-monospace, Menlo, Consolas, monospace; direction: ltr; text-align: left; overflow-wrap: anywhere; white-space: pre-wrap; }
        .apps { display: grid; gap: 10px; }
        .app { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .app-name { font-weight: 700; }
        .platforms { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
        .platforms a { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg); text-decoration: none; font-size: .85rem; }
        .platforms a.current { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
        .hint { display: none; margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--code); font-size: .9rem; }
        .hint.show { display: block; }
        .notice { border-inline-start: 4px solid var(--warn); }
        .downloads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        .downloads li { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .sha { font: .72rem ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; direction: ltr; text-align: left; color: var(--muted); }
        .toast { position: fixed; inset-inline: 16px; bottom: max(16px, env(safe-area-inset-bottom)); margin: 0 auto; max-width: 420px; padding: 10px 14px; border-radius: 10px; background: var(--fg); color: var(--bg); text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
        .toast.show { opacity: .95; }
        footer { text-align: center; }
        footer a { color: var(--muted); }
        @media (max-width: 360px) { .row, .stats { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body data-platform="android">
<main>
        <section class="card" data-status="suspended">
    <div class="head">
        <h1>Gold 30 days</h1>
        <span class="badge suspended">غیرفعال</span>
    </div>
    <div class="stats">
        <div class="stat">
            <span class="muted">تاریخ انقضا</span>
                            <b><time datetime="<date of now+20d+12h>"><jdate of now+20d+12h></time></b>
                <span class="muted ltr-num"><date of now+20d+12h></span>
                    </div>
        <div class="stat" data-days-left="20">
            <span class="muted">روزهای باقی‌مانده</span>
            <b>20 روز</b>
        </div>
        <div class="stat">
            <span class="muted">مصرف شده</span>
            <b class="ltr">12.5 GB</b>
        </div>
        <div class="stat">
            <span class="muted">باقی‌مانده</span>
            <b class="ltr">37.5 GB</b>
        </div>
    </div>
            <div class="bar" data-used-percent="25"
             role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-label="مصرف شده">
            <span style="width: 25%"></span>
        </div>
        <p class="muted" style="margin-top:6px">12.5 GB از 50 GB (25٪)</p>
    </section>

            <section class="card notice">
            <p>این سرویس غیرفعال شده است.</p>
            <p class="muted">برای تمدید یا خرید حجم، از ربات اقدام کنید.</p>
        </section>
            <footer class="muted">
                <a href="?lang=en&amp;platform=android">English</a>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
    <script>
(function () {
    'use strict';
    var T = {
        copied: "\u06a9\u067e\u06cc \u0634\u062f \u2705",
        copyFailed: "\u06a9\u067e\u06cc \u0646\u0634\u062f\u061b \u0644\u06cc\u0646\u06a9 \u0631\u0627 \u0627\u0632 \u06a9\u0627\u062f\u0631 \u0628\u0627\u0644\u0627 \u0627\u0646\u062a\u062e\u0627\u0628 \u0648 \u06a9\u067e\u06cc \u06a9\u0646\u06cc\u062f."
    };
    var doc = document;

    function toast(text) {
        var el = doc.getElementById('toast');
        if (!el) { return; }
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    function legacyCopy(text) {
        var area = doc.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        doc.body.appendChild(area);
        area.select();
        area.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = doc.execCommand('copy'); } catch (e) { ok = false; }
        doc.body.removeChild(area);
        return ok;
    }

    function copy(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () { toast(T.copied); }, function () {
                toast(legacyCopy(text) ? T.copied : T.copyFailed);
            });
            return;
        }
        toast(legacyCopy(text) ? T.copied : T.copyFailed);
    }

    function pageUrl() {
        // Without the fragment: it may carry Mini App launch data.
        return window.location.origin + window.location.pathname + window.location.search;
    }

    var tg = null;
    function webApp() {
        return tg || (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null);
    }

    function openExternal(button) {
        var app = webApp();
        if (app && typeof app.openLink === 'function') {
            app.openLink(pageUrl(), { try_instant_view: false });
            return;
        }
        var box = button.closest('[data-fallback], #in-app-hint') || doc;
        var hint = box.querySelector('[data-external-hint]');
        if (hint) { hint.hidden = false; }
    }

    doc.addEventListener('click', function (event) {
        var target = event.target.closest('[data-copy], [data-open-external], [data-deeplink]');
        if (!target) { return; }
        if (target.hasAttribute('data-copy')) {
            event.preventDefault();
            copy(target.getAttribute('data-copy'));
        } else if (target.hasAttribute('data-open-external')) {
            event.preventDefault();
            openExternal(target);
        } else if (target.hasAttribute('data-deeplink')) {
            var card = target.closest('[data-app]');
            setTimeout(function () {
                if (doc.visibilityState === 'visible' && card) {
                    var fallback = card.querySelector('[data-fallback]');
                    if (fallback) { fallback.classList.add('show'); }
                }
            }, 1600);
        }
    });

    doc.addEventListener('focusin', function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute('data-select-all')) { event.target.select(); }
    });

    // --- Telegram ---
    var hash = window.location.hash || '';
    var isMiniApp = /tgWebApp(Data|Version|Platform)=/.test(hash);
    var inTelegram = isMiniApp || !!(window.TelegramWebviewProxy || window.TelegramWebview) || /Telegram/i.test(navigator.userAgent);

    function applyTheme(theme) {
        if (!theme) { return; }
        var map = {
            bg_color: ['--card'], secondary_bg_color: ['--bg', '--code'], section_bg_color: ['--card'],
            text_color: ['--fg'], hint_color: ['--muted'], button_color: ['--accent'], button_text_color: ['--accent-fg']
        };
        Object.keys(map).forEach(function (key) {
            var value = theme[key];
            if (typeof value === 'string' && /^#[0-9a-f]{3,8}$/i.test(value)) {
                map[key].forEach(function (name) { doc.documentElement.style.setProperty(name, value); });
            }
        });
    }

    if (isMiniApp) {
        // The theme is in the launch parameters already: apply it before the script loads (or if it cannot).
        try {
            var params = new URLSearchParams(hash.slice(1));
            var raw = params.get('tgWebAppThemeParams');
            if (raw) { applyTheme(JSON.parse(raw)); }
        } catch (e) { /* ignore */ }

        var script = doc.createElement('script');
        script.src = 'https://telegram.org/js/telegram-web-app.js';
        script.async = true;
        script.onload = function () {
            if (!window.Telegram || !window.Telegram.WebApp) { return; }
            tg = window.Telegram.WebApp;
            applyTheme(tg.themeParams);
            if (typeof tg.onEvent === 'function') { tg.onEvent('themeChanged', function () { applyTheme(tg.themeParams); }); }
            if (typeof tg.ready === 'function') { tg.ready(); }
            if (typeof tg.expand === 'function') { tg.expand(); }
        };
        doc.head.appendChild(script);
    }

    if (inTelegram) {
        var hint = doc.getElementById('in-app-hint');
        if (hint) { hint.classList.add('show'); }
    }
})();
</script>

</body>
</html>
